name: towh
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.10.1


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  smooth_page_indicator: ^2.0.1
  flutter_svg: ^2.0.9
  fluentui_system_icons: ^1.1.273
  isar: ^3.1.0+1
  isar_flutter_libs:
    path: third_party/isar_flutter_libs
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
  flutter_launcher_icons: ^0.14.3




flutter:


  uses-material-design: true


  assets:
    - assets/images/onboardings/
    - assets/images/result_page/
    - assets/icons/

  fonts:
    - family: MPLUSR1
      fonts:
        - asset: assets/fonts/MPLUSRounded1c.ttf
          style: normal
        - asset: assets/fonts/MPLUSRounded1c-Medium.ttf
          weight: 500
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Bold.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/generated/ios_light.png
  image_path_android: assets/icons/generated/android_legacy.png
  image_path_ios: assets/icons/generated/ios_light.png
  image_path_ios_dark_transparent: assets/icons/generated/ios_dark.png
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: assets/icons/generated/android_background_white.png
  adaptive_icon_foreground: assets/icons/generated/android_foreground_only.png
  adaptive_icon_foreground_inset: 0
